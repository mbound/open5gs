# VPLMN 001-01 (serving network for roaming 999-70 UEs, home-routed): every NF
# of this PLMN reads this file. Derived from configs/examples/5gc-sepp2-001-01.yaml.in
# and the VPLMN half of configs/inter-plmn-hr-n2.yaml.in, minus EPC/metrics. No
# AUSF/UDM: authentication and subscription data come from the HPLMN via the
# SEPPs (TS 23.501 §4.2.4). Same FQDN scheme as 999-70.yaml; addresses: README.md.
db_uri: mongodb://mongodb-v/open5gs

logger:
  level: info

global:
  max:
    ue: 1024

nrf:
  serving:
    - plmn_id:
        mcc: 001
        mnc: 01
  sbi:
    server:
      - address: nrf.5gc.mnc001.mcc001.3gppnetwork.org

scp:
  sbi:
    server:
      - address: scp.5gc.mnc001.mcc001.3gppnetwork.org
    client:
      nrf:
        - uri: http://nrf.5gc.mnc001.mcc001.3gppnetwork.org

sepp:
  sbi:
    server:
      - address: sepp.5gc.mnc001.mcc001.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc001.mcc001.3gppnetwork.org
  n32:
    server:
      - sender: sepp.5gc.mnc001.mcc001.3gppnetwork.org
        address: 172.30.3.20
        port: 7777
        n32f:
          address: 172.30.3.20
          port: 7778
    client:
      sepp:
        - receiver: sepp.5gc.mnc070.mcc999.3gppnetwork.org
          uri: http://172.30.3.10:7777
          n32f:
            uri: http://172.30.3.10:7778

amf:
  sbi:
    server:
      - address: amf.5gc.mnc001.mcc001.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc001.mcc001.3gppnetwork.org
  ngap:
    server:
      - address: 172.30.4.6
  access_control:       # admit roamers from the HPLMN
    - plmn_id:
        mcc: 999
        mnc: 70
  guami:
    - plmn_id:
        mcc: 001
        mnc: 01
      amf_id:
        region: 2
        set: 1
        pointer: 30
  tai:
    - plmn_id:
        mcc: 001
        mnc: 01
      tac: 2
  plmn_support:
    - plmn_id:
        mcc: 001
        mnc: 01
      s_nssai:
        - sst: 1
  security:
    integrity_order: [ NIA2, NIA1, NIA0 ]
    ciphering_order: [ NEA0, NEA1, NEA2 ]
  network_name:
    full: Open5GS-VPLMN
  amf_name: amf-v
  time:
    t3512:
      value: 540

smf:
  sbi:
    server:
      - address: smf.5gc.mnc001.mcc001.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc001.mcc001.3gppnetwork.org
  pfcp:
    server:
      - address: 172.30.2.4
    client:
      upf:
        - address: 172.30.2.7
  gtpu:
    server:
      - address: 172.30.2.4
  # Not used for HR sessions (the H-SMF allocates the UE address);
  # smf_context_validation() requires a subnet.
  session:
    - subnet: 10.46.0.0/16
      gateway: 10.46.0.1
  dns:
    - 8.8.8.8
  mtu: 1400

upf:
  pfcp:
    server:
      - address: 172.30.2.7
  gtpu:
    server:
      - address: 172.30.4.8
  session:              # placeholder; the UPF requires one
    - subnet: 10.46.0.0/16
      gateway: 10.46.0.1
      dev: ogstun

udr:
  sbi:
    server:
      - address: udr.5gc.mnc001.mcc001.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc001.mcc001.3gppnetwork.org

# V-PCF for the roamers' AM policy (TS 23.502 §4.16.1.2). Open5GS reads the
# UE-AMBR for AM policy from the PCF's own DB (src/pcf/nudr-handler.c), so
# mongodb-v holds a copy of the roaming subscribers (scripts/provision.sh).
pcf:
  sbi:
    server:
      - address: pcf.5gc.mnc001.mcc001.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc001.mcc001.3gppnetwork.org

nssf:
  sbi:
    server:
      - address: nssf.5gc.mnc001.mcc001.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc001.mcc001.3gppnetwork.org
      nsi:
        - uri: http://nrf.5gc.mnc001.mcc001.3gppnetwork.org
          s_nssai:
            sst: 1
