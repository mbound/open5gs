# Config for the fork's `inter-plmn-hr-n2` test binary run against this compose
# (service ho-test, profile ho). The binary reads only what its simulated gNBs/UE
# need: the two AMFs' NGAP addresses (first amf block = source/HPLMN, second =
# target/VPLMN), their TAIs and PLMNs, the serving PLMNs and mongodb-h (it writes
# the test subscriber imsi-999700000000002 itself). All no_* flags are set so it
# starts no NFs of its own. gNB N3 addresses come from TEST_GNB1_ADDR/TEST_GNB2_ADDR.
db_uri: mongodb://mongodb-h/open5gs

logger:
  level: info

global:
  parameter:
    no_nrf: true
    no_scp: true
    no_sepp: true
    no_amf: true
    no_smf: true
    no_upf: true
    no_ausf: true
    no_udm: true
    no_pcf: true
    no_nssf: true
    no_bsf: true
    no_udr: true
    no_eir: true
    no_mme: true
    no_sgwc: true
    no_sgwu: true
    no_pcrf: true
    no_hss: true

test:
  serving:
    - plmn_id:
        mcc: 999
        mnc: 70
    - plmn_id:
        mcc: 001
        mnc: 01

amf:
  ngap:
    server:
      - address: 172.30.4.5
  tai:
    - plmn_id:
        mcc: 999
        mnc: 70
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: 999
        mnc: 70
      s_nssai:
        - sst: 1

amf:
  ngap:
    server:
      - address: 172.30.4.6
  tai:
    - plmn_id:
        mcc: 001
        mnc: 01
      tac: 2
  plmn_support:
    - plmn_id:
        mcc: 001
        mnc: 01
      s_nssai:
        - sst: 1
