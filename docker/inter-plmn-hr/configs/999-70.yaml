# HPLMN 999-70 (home of the test UEs): every NF of this PLMN reads this file
# (`open5gs-<nf>d -c /etc/open5gs-hr/999-70.yaml`). Derived from
# configs/examples/5gc-sepp1-999-70.yaml.in and the HPLMN half of
# configs/inter-plmn-hr-n2.yaml.in (GUAMI pointer, t3512), minus EPC.
# SBI servers bind to their 3GPP FQDN, a Docker alias on sbi-h, so the SCP sees
# the target PLMN in every URI and sends foreign-PLMN requests to the SEPP
# (TS 29.500 §6.10, TS 23.003 §28.3.2.3). Port omitted = 80. Addresses: README.md.
# AMF, SMF, UPF and PCF serve Prometheus metrics on :9090 (README.md, Monitoring and WebUI).
db_uri: mongodb://mongodb-h/open5gs

logger:
  level: info

global:
  max:
    ue: 1024

nrf:
  serving:              # PLMN every NF of this file learns from its NRF
    - plmn_id:
        mcc: 999
        mnc: 70
  sbi:
    server:
      - address: nrf.5gc.mnc070.mcc999.3gppnetwork.org

scp:
  sbi:
    server:
      - address: scp.5gc.mnc070.mcc999.3gppnetwork.org
    client:
      nrf:
        - uri: http://nrf.5gc.mnc070.mcc999.3gppnetwork.org

sepp:
  sbi:
    server:
      - address: sepp.5gc.mnc070.mcc999.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc070.mcc999.3gppnetwork.org
  n32:                  # N32-c / N32-f on the ipx network, plain http (no TLS, no PRINS)
    server:
      - sender: sepp.5gc.mnc070.mcc999.3gppnetwork.org
        address: 172.30.3.10
        port: 7777
        n32f:
          address: 172.30.3.10
          port: 7778
    client:
      sepp:
        - receiver: sepp.5gc.mnc001.mcc001.3gppnetwork.org
          uri: http://172.30.3.20:7777
          n32f:
            uri: http://172.30.3.20:7778

amf:
  metrics:              # /metrics + JSON info API, all interfaces (README: Monitoring)
    server:
      - address: 0.0.0.0
        port: 9090
  sbi:
    server:
      - address: amf.5gc.mnc070.mcc999.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc070.mcc999.3gppnetwork.org
  ngap:
    server:
      - address: 172.30.4.5
  guami:
    - plmn_id:
        mcc: 999
        mnc: 70
      amf_id:
        region: 2
        set: 1
        pointer: 31
  tai:
    - plmn_id:
        mcc: 999
        mnc: 70
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: 999
        mnc: 70
      s_nssai:
        - sst: 1
  security:
    integrity_order: [ NIA2, NIA1, NIA0 ]
    ciphering_order: [ NEA0, NEA1, NEA2 ]
  network_name:
    full: Open5GS-HPLMN
  amf_name: amf-h
  time:
    t3512:
      value: 540

smf:
  metrics:              # /metrics + JSON info API, all interfaces (README: Monitoring)
    server:
      - address: 0.0.0.0
        port: 9090
  sbi:
    server:
      - address: smf.5gc.mnc070.mcc999.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc070.mcc999.3gppnetwork.org
  pfcp:
    server:
      - address: 172.30.1.4
    client:
      upf:
        - address: 172.30.1.7
  gtpu:
    server:
      - address: 172.30.1.4
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
  dns:
    - 8.8.8.8
  mtu: 1400

upf:
  metrics:              # /metrics + JSON info API, all interfaces (README: Monitoring)
    server:
      - address: 0.0.0.0
        port: 9090
  pfcp:
    server:
      - address: 172.30.1.7
  gtpu:                 # N3 (from gNBs) and N9 (from V-UPF) on the ran network
    server:
      - address: 172.30.4.7
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dev: ogstun

ausf:
  sbi:
    server:
      - address: ausf.5gc.mnc070.mcc999.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc070.mcc999.3gppnetwork.org

udm:                    # no hnet keys: UEs use the null SUCI scheme
  sbi:
    server:
      - address: udm.5gc.mnc070.mcc999.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc070.mcc999.3gppnetwork.org

udr:
  sbi:
    server:
      - address: udr.5gc.mnc070.mcc999.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc070.mcc999.3gppnetwork.org

pcf:                    # policy from the UDR (subscriber data written by open5gs-dbctl)
  metrics:              # /metrics + JSON info API, all interfaces (README: Monitoring)
    server:
      - address: 0.0.0.0
        port: 9090
  sbi:
    server:
      - address: pcf.5gc.mnc070.mcc999.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc070.mcc999.3gppnetwork.org

bsf:
  sbi:
    server:
      - address: bsf.5gc.mnc070.mcc999.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc070.mcc999.3gppnetwork.org

nssf:
  sbi:
    server:
      - address: nssf.5gc.mnc070.mcc999.3gppnetwork.org
    client:
      scp:
        - uri: http://scp.5gc.mnc070.mcc999.3gppnetwork.org
      nsi:
        - uri: http://nrf.5gc.mnc070.mcc999.3gppnetwork.org
          s_nssai:
            sst: 1
